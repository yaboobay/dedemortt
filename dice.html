<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D20 Simulator Ultra - Hyper Realistic Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=MedievalSharp&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #f4d03f;
            --gold-dark: #b8860b;
            --crimson: #dc143c;
            --parchment: #f5e6c8;
            --wood: #5d3a1a;
        }

        body {
            font-family: 'Cinzel', serif;
            background: #1a0f08;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        canvas {
            display: block;
            cursor: default;
        }

        .result-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 100;
        }

        .result-label {
            font-family: 'MedievalSharp', cursive;
            font-size: 1.2rem;
            color: var(--gold);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            margin-bottom: 5px;
            opacity: 0.9;
        }

        .result-value {
            font-family: 'Cinzel', serif;
            font-size: 5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5), 3px 3px 0 var(--gold-dark), 5px 5px 10px rgba(0, 0, 0, 0.8);
            min-width: 150px;
            display: inline-block;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.4) 100%);
            border: 3px solid var(--gold);
            border-radius: 15px;
            padding: 10px 30px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .result-value.critical {
            color: #ffd700;
            animation: criticalGlow 0.5s ease-in-out infinite alternate;
            border-color: #ffd700;
            background: linear-gradient(180deg, rgba(50, 30, 0, 0.9) 0%, rgba(30, 15, 0, 0.7) 100%);
        }

        .result-value.fumble {
            color: #ff4444;
            border-color: #ff4444;
            animation: fumbleShake 0.1s ease-in-out infinite;
            background: linear-gradient(180deg, rgba(50, 0, 0, 0.9) 0%, rgba(30, 0, 0, 0.7) 100%);
        }

        @keyframes criticalGlow {
            from {
                text-shadow: 0 0 20px #ffd700, 0 0 40px #ff8c00, 3px 3px 0 #8b6914;
            }

            to {
                text-shadow: 0 0 40px #ffd700, 0 0 80px #ff8c00, 0 0 120px #ff4500, 3px 3px 0 #8b6914;
            }
        }

        @keyframes fumbleShake {

            0%,
            100% {
                transform: rotate(-2deg);
            }

            50% {
                transform: rotate(2deg);
            }
        }

        .instructions {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'MedievalSharp', cursive;
            font-size: 1rem;
            color: var(--parchment);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            text-align: center;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
            opacity: 0.8;
        }

        .dice-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, rgba(30, 18, 10, 0.95) 0%, rgba(45, 28, 15, 0.9) 100%);
            border: 2px solid var(--gold-dark);
            border-radius: 12px;
            padding: 14px;
            z-index: 10;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .dice-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 0.9rem;
            color: var(--gold);
            text-align: center;
            margin-bottom: 8px;
        }

        .dice-options {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .dice-btn {
            width: 34px;
            height: 34px;
            border: 2px solid var(--gold-dark);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.4);
            color: var(--parchment);
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dice-btn:hover {
            background: rgba(212, 175, 55, 0.3);
            transform: scale(1.1) translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .dice-btn.active {
            background: linear-gradient(135deg, var(--gold-dark), #a67c00);
            color: #fff;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        .dice-mode {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .mode-btn {
            padding: 7px 10px;
            border: 1px solid var(--gold-dark);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.4);
            color: var(--parchment);
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-btn:hover {
            background: rgba(212, 175, 55, 0.2);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--gold-dark), #a67c00);
            color: #fff;
        }

        .multi-results {
            position: absolute;
            top: 150px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90%;
            gap: 12px;
            pointer-events: none;
            z-index: 100;
        }

        .die-result {
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.6) 100%);
            border: 2px solid var(--gold-dark);
            border-radius: 12px;
            padding: 10px 18px;
            text-align: center;
            opacity: 0;
            transform: translateY(-20px) scale(0.8);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(8px);
        }

        .die-result.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .die-result.critical {
            border-color: #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6), inset 0 0 20px rgba(255, 215, 0, 0.1);
        }

        .die-result.fumble {
            border-color: #ff4444;
            box-shadow: 0 0 25px rgba(255, 68, 68, 0.6), inset 0 0 20px rgba(255, 68, 68, 0.1);
        }

        .die-result.best {
            border-color: #4eff4e;
            box-shadow: 0 0 25px rgba(78, 255, 78, 0.6);
        }

        .die-result.worst {
            border-color: #ff6666;
            box-shadow: 0 0 25px rgba(255, 102, 102, 0.6);
        }

        .die-result.ignored {
            opacity: 0.4;
            filter: grayscale(0.5);
        }

        .die-label {
            font-family: 'MedievalSharp', cursive;
            font-size: 0.75rem;
            color: var(--gold);
        }

        .die-value {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .theme-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, rgba(30, 18, 10, 0.95) 0%, rgba(45, 28, 15, 0.9) 100%);
            border: 2px solid var(--gold-dark);
            border-radius: 12px;
            padding: 14px;
            z-index: 10;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .theme-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 0.9rem;
            color: var(--gold);
            text-align: center;
            margin-bottom: 10px;
        }

        .theme-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .theme-btn {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .theme-btn::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .theme-btn:hover {
            transform: scale(1.2) translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
        }

        .theme-btn:hover::after {
            border-color: rgba(255, 255, 255, 0.3);
        }

        .theme-btn.active {
            transform: scale(1.15);
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
        }

        .theme-btn.active::after {
            border-color: var(--gold);
        }

        .history-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, rgba(30, 18, 10, 0.95) 0%, rgba(45, 28, 15, 0.9) 100%);
            border: 2px solid var(--gold-dark);
            border-radius: 12px;
            padding: 12px 16px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            min-width: 110px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .history-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 0.9rem;
            color: var(--gold);
            text-align: center;
            margin-bottom: 8px;
        }

        .history-list {
            list-style: none;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            font-size: 0.85rem;
        }

        .roll-num {
            color: rgba(245, 230, 200, 0.5);
            font-family: 'MedievalSharp', cursive;
        }

        .roll-value {
            color: var(--parchment);
            font-weight: 700;
        }

        .roll-value.crit {
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700;
        }

        .roll-value.fail {
            color: #ff4444;
            text-shadow: 0 0 8px #ff4444;
        }

        .stats-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(30, 18, 10, 0.95) 0%, rgba(45, 28, 15, 0.9) 100%);
            border: 2px solid var(--gold-dark);
            border-radius: 12px;
            padding: 12px 24px;
            display: flex;
            gap: 30px;
            z-index: 10;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-family: 'MedievalSharp', cursive;
            font-size: 0.7rem;
            color: var(--gold);
            display: block;
            opacity: 0.9;
        }

        .stat-value {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--parchment);
        }

        .stat-item.crit .stat-value {
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .stat-item.fail .stat-value {
            color: #ff4444;
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
        }

        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 200;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .quality-badge {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'MedievalSharp', cursive;
            font-size: 0.7rem;
            color: var(--gold);
            opacity: 0.6;
            pointer-events: none;
            z-index: 5;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            .result-value {
                font-size: 3.5rem;
                padding: 8px 20px;
            }

            .history-panel {
                max-height: 150px;
                padding: 8px;
            }

            .dice-panel {
                max-width: 45%;
            }

            .theme-btn {
                width: 24px;
                height: 24px;
            }

            .instructions {
                font-size: 0.75rem;
                bottom: 75px;
                white-space: normal;
                max-width: 90%;
            }

            .quality-badge {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div id="canvas-container">
        <div class="quality-badge">✦ ULTRA REALISTIC ✦</div>
        <div class="result-container">
            <div class="result-label">🎲 Résultat 🎲</div>
            <div class="result-value" id="result">--</div>
        </div>
        <div class="multi-results" id="multi-results"></div>
        <div id="particles"></div>
        <div class="history-panel">
            <div class="history-title">📜 Historique</div>
            <ul class="history-list" id="history"></ul>
        </div>
        <div class="dice-panel">
            <div class="dice-title">🎲 Nombre</div>
            <div class="dice-options">
                <button class="dice-btn active" data-count="1">1</button>
                <button class="dice-btn" data-count="2">2</button>
                <button class="dice-btn" data-count="3">3</button>
                <button class="dice-btn" data-count="4">4</button>
            </div>
            <div class="dice-mode">
                <button class="mode-btn active" data-mode="sum">Σ Somme</button>

        <div class="theme-panel">
            <div class="theme-title">🎨 Thème</div>
            <div class="theme-options">
                <button class="theme-btn active" data-theme="amethyst"
                    style="background: linear-gradient(135deg, #9c27b0, #4a148c);" title="Améthyste"></button>
                <button class="theme-btn" data-theme="ruby"
                    style="background: linear-gradient(135deg, #f44336, #8e0000);" title="Rubis"></button>
                <button class="theme-btn" data-theme="emerald"
                    style="background: linear-gradient(135deg, #4caf50, #1b5e20);" title="Émeraude"></button>
                <button class="theme-btn" data-theme="gold"
                    style="background: linear-gradient(135deg, #ffd700, #b8860b);" title="Or"></button>
                <button class="theme-btn" data-theme="obsidian"
                    style="background: linear-gradient(135deg, #455a64, #102027);" title="Obsidienne"></button>
                <button class="theme-btn" data-theme="ice"
                    style="background: linear-gradient(135deg, #81d4fa, #0277bd);" title="Glace"></button>
                <button class="theme-btn" data-theme="fire"
                    style="background: linear-gradient(135deg, #ff9800, #bf360c);" title="Feu"></button>
                <button class="theme-btn" data-theme="cosmic"
                    style="background: linear-gradient(135deg, #7c4dff, #000051);" title="Cosmique"></button>
            </div>
        </div>
        <p class="instructions">🖱️ Glisser pour lancer • Espace = lancer rapide • 📱 Secouer sur mobile</p>
        <div class="stats-panel">
            <div class="stat-item"><span class="stat-label">Moyenne</span><span class="stat-value"
                    id="stat-avg">--</span></div>
            <div class="stat-item crit"><span class="stat-label">Nat 20</span><span class="stat-value"
                    id="stat-crits">0</span></div>
            <div class="stat-item fail"><span class="stat-label">Nat 1</span><span class="stat-value"
                    id="stat-fumbles">0</span></div>
        </div>
    </div>
    <script type="importmap">{ "imports": { 
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", 
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js" 
    } }</script>
    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon-es';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // Enhanced PBR Themes with realistic gem properties
        const DICE_THEMES = {
            amethyst: {
                baseColor: 0x4a148c, accentColor: 0x9c27b0, numberColor: '#ffffff',
                metalness: 0.1, roughness: 0.08, clearcoat: 1.0, clearcoatRoughness: 0.03,
                emissive: 0x2a0050, emissiveIntensity: 0.08,
                transmission: 0.3, thickness: 0.5, ior: 1.55, // Amethyst IOR
                bloomStrength: 0.15, iridescence: 0.3
            },
            ruby: {
                baseColor: 0x8e0000, accentColor: 0xf44336, numberColor: '#ffd700',
                metalness: 0.15, roughness: 0.06, clearcoat: 1.0, clearcoatRoughness: 0.02,
                emissive: 0x4a0000, emissiveIntensity: 0.12,
                transmission: 0.25, thickness: 0.6, ior: 1.77, // Ruby IOR
                bloomStrength: 0.2, iridescence: 0.1
            },
            emerald: {
                baseColor: 0x1b5e20, accentColor: 0x4caf50, numberColor: '#ffffff',
                metalness: 0.1, roughness: 0.07, clearcoat: 1.0, clearcoatRoughness: 0.02,
                emissive: 0x0a3010, emissiveIntensity: 0.1,
                transmission: 0.35, thickness: 0.5, ior: 1.58, // Emerald IOR
                bloomStrength: 0.12, iridescence: 0.2
            },
            gold: {
                baseColor: 0xb8860b, accentColor: 0xffd700, numberColor: '#1a0a00',
                metalness: 0.95, roughness: 0.15, clearcoat: 0.3, clearcoatRoughness: 0.1,
                emissive: 0x4a3800, emissiveIntensity: 0.05,
                transmission: 0, thickness: 0, ior: 1.5,
                bloomStrength: 0.25, iridescence: 0.0, isMetallic: true
            },
            obsidian: {
                baseColor: 0x0a1015, accentColor: 0x263238, numberColor: '#90a4ae',
                metalness: 0.9, roughness: 0.02, clearcoat: 1.0, clearcoatRoughness: 0.01,
                emissive: 0x000000, emissiveIntensity: 0,
                transmission: 0.1, thickness: 0.3, ior: 1.5,
                bloomStrength: 0.05, iridescence: 0.4
            },
            ice: {
                baseColor: 0x0277bd, accentColor: 0x81d4fa, numberColor: '#ffffff',
                metalness: 0.0, roughness: 0.02, clearcoat: 1.0, clearcoatRoughness: 0.01,
                emissive: 0x01579b, emissiveIntensity: 0.15,
                transmission: 0.6, thickness: 0.8, ior: 1.31, // Ice IOR
                bloomStrength: 0.3, iridescence: 0.5
            },
            fire: {
                baseColor: 0xbf360c, accentColor: 0xff9800, numberColor: '#ffeb3b',
                metalness: 0.3, roughness: 0.25, clearcoat: 0.6, clearcoatRoughness: 0.1,
                emissive: 0xff5722, emissiveIntensity: 0.4,
                transmission: 0.15, thickness: 0.4, ior: 1.5,
                bloomStrength: 0.5, iridescence: 0.1, animated: true
            },
            cosmic: {
                baseColor: 0x0d0221, accentColor: 0x7c4dff, numberColor: '#e8eaf6',
                metalness: 0.4, roughness: 0.08, clearcoat: 1.0, clearcoatRoughness: 0.03,
                emissive: 0x651fff, emissiveIntensity: 0.35,
                transmission: 0.2, thickness: 0.5, ior: 1.6,
                bloomStrength: 0.6, iridescence: 0.6, hasStars: true, animated: true
            }
        };

        const MATERIAL_CACHE = new Map();

        // Procedural Normal Map Generator
        function generateNormalMap(size = 256) {
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Base neutral normal (pointing up)
            ctx.fillStyle = 'rgb(128, 128, 255)';
            ctx.fillRect(0, 0, size, size);

            // Add scratches and imperfections
            for (let i = 0; i < 40; i++) {
                const x1 = Math.random() * size;
                const y1 = Math.random() * size;
                const length = 20 + Math.random() * 60;
                const angle = Math.random() * Math.PI * 2;

                ctx.strokeStyle = `rgba(${128 + (Math.random() - 0.5) * 30}, ${128 + (Math.random() - 0.5) * 30}, 255, 0.3)`;
                ctx.lineWidth = 0.5 + Math.random() * 1.5;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x1 + Math.cos(angle) * length, y1 + Math.sin(angle) * length);
                ctx.stroke();
            }

            // Add micro pits
            for (let i = 0; i < 100; i++) {
                const x = Math.random() * size;
                const y = Math.random() * size;
                const r = 1 + Math.random() * 3;

                const gradient = ctx.createRadialGradient(x, y, 0, x, y, r);
                gradient.addColorStop(0, 'rgba(100, 100, 255, 0.4)');
                gradient.addColorStop(1, 'rgba(128, 128, 255, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        // Procedural Roughness Map
        function generateRoughnessMap(size = 256, baseRoughness = 0.1) {
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Base roughness
            const baseValue = Math.floor(baseRoughness * 255);
            ctx.fillStyle = `rgb(${baseValue}, ${baseValue}, ${baseValue})`;
            ctx.fillRect(0, 0, size, size);

            // Edge wear - rougher on edges
            const edgeGradient = ctx.createRadialGradient(size / 2, size / 2, size * 0.2, size / 2, size / 2, size * 0.5);
            edgeGradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
            edgeGradient.addColorStop(1, 'rgba(80, 80, 80, 0.3)');
            ctx.fillStyle = edgeGradient;
            ctx.fillRect(0, 0, size, size);

            // Random variation
            const imageData = ctx.getImageData(0, 0, size, size);
            for (let i = 0; i < imageData.data.length; i += 4) {
                const noise = (Math.random() - 0.5) * 25;
                imageData.data[i] = Math.max(0, Math.min(255, imageData.data[i] + noise));
                imageData.data[i + 1] = imageData.data[i];
                imageData.data[i + 2] = imageData.data[i];
            }
            ctx.putImageData(imageData, 0, 0);

            return new THREE.CanvasTexture(canvas);
        }

        // Procedural AO Map for number indentations
        function generateAOMap(size = 256) {
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = size;
            const ctx = canvas.getContext('2d');

            // White base (no occlusion)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);

            // Darker in center where number is
            const centerAO = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size * 0.4);
            centerAO.addColorStop(0, 'rgba(0, 0, 0, 0.15)');
            centerAO.addColorStop(0.5, 'rgba(0, 0, 0, 0.08)');
            centerAO.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = centerAO;
            ctx.fillRect(0, 0, size, size);

            // Edge darkening
            const edgeAO = ctx.createRadialGradient(size / 2, size / 2, size * 0.35, size / 2, size / 2, size * 0.5);
            edgeAO.addColorStop(0, 'rgba(0, 0, 0, 0)');
            edgeAO.addColorStop(1, 'rgba(0, 0, 0, 0.2)');
            ctx.fillStyle = edgeAO;
            ctx.fillRect(0, 0, size, size);

            return new THREE.CanvasTexture(canvas);
        }

        // Rich procedural HDRI-like environment
        function generateHDRIEnvironment(renderer) {
            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = size * 2;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Dark tavern base
            const bgGradient = ctx.createLinearGradient(0, 0, 0, size);
            bgGradient.addColorStop(0, '#1a0f05');
            bgGradient.addColorStop(0.3, '#2d1810');
            bgGradient.addColorStop(0.7, '#1a0a05');
            bgGradient.addColorStop(1, '#0a0502');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, size * 2, size);

            // Add warm light sources (candles/torches)
            const lights = [
                { x: size * 0.2, y: size * 0.3, r: 120, color: '#ff8844', intensity: 0.9 },
                { x: size * 1.7, y: size * 0.35, r: 100, color: '#ff9955', intensity: 0.7 },
                { x: size * 0.8, y: size * 0.2, r: 80, color: '#ffaa66', intensity: 0.5 },
                { x: size * 1.2, y: size * 0.25, r: 90, color: '#ff7733', intensity: 0.6 },
                { x: size * 0.5, y: size * 0.15, r: 150, color: '#ffcc88', intensity: 0.4 },
            ];

            lights.forEach(light => {
                const gradient = ctx.createRadialGradient(light.x, light.y, 0, light.x, light.y, light.r);
                gradient.addColorStop(0, light.color);
                gradient.addColorStop(0.3, light.color + '88');
                gradient.addColorStop(0.7, light.color + '22');
                gradient.addColorStop(1, 'transparent');
                ctx.globalAlpha = light.intensity;
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size * 2, size);
            });
            ctx.globalAlpha = 1;

            // Add subtle cool fill from "windows"
            const coolLight = ctx.createRadialGradient(size, size * 0.1, 0, size, size * 0.1, size * 0.8);
            coolLight.addColorStop(0, 'rgba(100, 120, 160, 0.15)');
            coolLight.addColorStop(1, 'transparent');
            ctx.fillStyle = coolLight;
            ctx.fillRect(0, 0, size * 2, size);

            const texture = new THREE.CanvasTexture(canvas);
            texture.mapping = THREE.EquirectangularReflectionMapping;
            texture.colorSpace = THREE.SRGBColorSpace;

            const pmrem = new THREE.PMREMGenerator(renderer);
            pmrem.compileEquirectangularShader();
            const envRT = pmrem.fromEquirectangular(texture);
            texture.dispose();
            pmrem.dispose();

            return envRT.texture;
        }

        class D20Builder {
            constructor(theme = 'amethyst') {
                this.theme = DICE_THEMES[theme] || DICE_THEMES.amethyst;
                this.themeName = theme;
                this.faceValues = [14, 20, 4, 2, 8, 10, 16, 12, 6, 18, 17, 3, 19, 7, 11, 9, 15, 5, 13, 1];

                // Generate shared maps once
                if (!D20Builder.normalMap) {
                    D20Builder.normalMap = generateNormalMap(256);
                    D20Builder.normalMap.wrapS = D20Builder.normalMap.wrapT = THREE.RepeatWrapping;
                }
                if (!D20Builder.aoMap) {
                    D20Builder.aoMap = generateAOMap(256);
                }
            }

            setTheme(themeName) {
                this.theme = DICE_THEMES[themeName] || DICE_THEMES.amethyst;
                this.themeName = themeName;
            }

            getOrCreateThemeMaterials(envMap) {
                const key = this.themeName;
                const cached = MATERIAL_CACHE.get(key);
                if (cached) {
                    cached.materials.forEach(mat => {
                        if (mat.envMap !== envMap) {
                            mat.envMap = envMap;
                            mat.envMapIntensity = this.theme.isMetallic ? 1.2 : 0.8;
                            mat.needsUpdate = true;
                        }
                    });
                    return cached.materials;
                }

                // Generate theme-specific roughness map
                const roughnessMap = generateRoughnessMap(256, this.theme.roughness);

                const materials = [], textures = [];
                for (let i = 0; i < 20; i++) {
                    const { material, texture } = this.createFaceMaterial(this.faceValues[i], envMap, roughnessMap);
                    materials.push(material);
                    textures.push(texture);
                }
                MATERIAL_CACHE.set(key, { materials, textures, roughnessMap });
                return materials;
            }

            // Create beveled icosahedron geometry
            createBeveledIcosahedron(radius, bevelSize = 0.02) {
                const geo = new THREE.IcosahedronGeometry(radius, 1); // Subdivide once for smoother edges

                // Slightly shrink vertices that are on edges for pseudo-bevel effect
                const positions = geo.attributes.position;
                const normals = geo.attributes.normal;

                for (let i = 0; i < positions.count; i++) {
                    const nx = normals.getX(i);
                    const ny = normals.getY(i);
                    const nz = normals.getZ(i);

                    // Pull vertices slightly inward along normal for softer look
                    positions.setX(i, positions.getX(i) - nx * bevelSize * 0.1);
                    positions.setY(i, positions.getY(i) - ny * bevelSize * 0.1);
                    positions.setZ(i, positions.getZ(i) - nz * bevelSize * 0.1);
                }

                geo.computeVertexNormals();
                return geo;
            }

            createD20Mesh(envMap = null) {
                // Use base icosahedron for proper face mapping
                const baseGeo = new THREE.IcosahedronGeometry(0.65, 0);
                const posAttr = baseGeo.attributes.position;
                const faceCount = posAttr.count / 3;
                this.faceData = [];
                const materials = this.getOrCreateThemeMaterials(envMap);

                for (let i = 0; i < faceCount; i++) {
                    const idx = i * 3;
                    const v0 = new THREE.Vector3(posAttr.getX(idx), posAttr.getY(idx), posAttr.getZ(idx));
                    const v1 = new THREE.Vector3(posAttr.getX(idx + 1), posAttr.getY(idx + 1), posAttr.getZ(idx + 1));
                    const v2 = new THREE.Vector3(posAttr.getX(idx + 2), posAttr.getY(idx + 2), posAttr.getZ(idx + 2));
                    const center = new THREE.Vector3().add(v0).add(v1).add(v2).divideScalar(3);
                    this.faceData.push({ center, normal: center.clone().normalize(), value: this.faceValues[i] });
                }

                baseGeo.clearGroups();
                for (let i = 0; i < faceCount; i++) baseGeo.addGroup(i * 3, 3, i);
                const uvs = [];
                for (let i = 0; i < faceCount; i++) uvs.push(0.5, 1, 0, 0.13, 1, 0.13);
                baseGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));

                const die = new THREE.Mesh(baseGeo, materials);
                this.dieMesh = die;
                this.materials = materials;

                // Refined gold edges with slight glow
                const edgeGeo = new THREE.EdgesGeometry(baseGeo, 1);
                const edgeMat = new THREE.LineBasicMaterial({
                    color: 0xd4af37,
                    transparent: true,
                    opacity: 0.9
                });
                const edges = new THREE.LineSegments(edgeGeo, edgeMat);
                die.add(edges);

                return die;
            }

            createFaceMaterial(number, envMap, roughnessMap) {
                const canvas = document.createElement('canvas');
                const size = 512; // Higher res for quality
                canvas.width = canvas.height = size;
                const ctx = canvas.getContext('2d');
                const theme = this.theme;

                // Rich gradient background with depth
                const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size * 0.7);
                const baseHex = '#' + theme.baseColor.toString(16).padStart(6, '0');
                const accentHex = '#' + theme.accentColor.toString(16).padStart(6, '0');
                gradient.addColorStop(0, accentHex);
                gradient.addColorStop(0.4, this.blendColors(accentHex, baseHex, 0.5));
                gradient.addColorStop(0.7, baseHex);
                gradient.addColorStop(1, this.darkenColor(baseHex, 0.3));
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size, size);

                // Subtle crystalline structure for gems
                if (theme.transmission > 0) {
                    for (let i = 0; i < 8; i++) {
                        const cx = size * 0.2 + Math.random() * size * 0.6;
                        const cy = size * 0.2 + Math.random() * size * 0.6;
                        const facetGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 0.3);
                        facetGrad.addColorStop(0, 'rgba(255, 255, 255, 0.08)');
                        facetGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.02)');
                        facetGrad.addColorStop(1, 'transparent');
                        ctx.fillStyle = facetGrad;
                        ctx.fillRect(0, 0, size, size);
                    }
                }

                // Refined noise texture
                const imageData = ctx.getImageData(0, 0, size, size);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const noise = (Math.random() - 0.5) * 12;
                    data[i] = Math.max(0, Math.min(255, data[i] + noise));
                    data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + noise));
                    data[i + 2] = Math.max(0, Math.min(255, data[i + 2] + noise));
                }
                ctx.putImageData(imageData, 0, 0);

                // Stars for cosmic theme
                if (theme.hasStars) {
                    for (let i = 0; i < 25; i++) {
                        const x = Math.random() * size;
                        const y = Math.random() * size;
                        const r = Math.random() * 2 + 0.5;
                        const brightness = Math.random() * 0.8 + 0.2;

                        const starGrad = ctx.createRadialGradient(x, y, 0, x, y, r * 2);
                        starGrad.addColorStop(0, `rgba(255, 255, 255, ${brightness})`);
                        starGrad.addColorStop(0.5, `rgba(200, 220, 255, ${brightness * 0.5})`);
                        starGrad.addColorStop(1, 'transparent');
                        ctx.fillStyle = starGrad;
                        ctx.fillRect(x - r * 2, y - r * 2, r * 4, r * 4);
                    }
                }

                // Inner glow/depth
                const innerGlow = ctx.createRadialGradient(size / 2, size / 2 - size * 0.1, size * 0.1, size / 2, size / 2, size * 0.5);
                innerGlow.addColorStop(0, 'rgba(255, 255, 255, 0.12)');
                innerGlow.addColorStop(0.5, 'rgba(255, 255, 255, 0.03)');
                innerGlow.addColorStop(1, 'rgba(0, 0, 0, 0.15)');
                ctx.fillStyle = innerGlow;
                ctx.fillRect(0, 0, size, size);

                // Number rendering with depth
                let numberColor = theme.numberColor;
                let glowColor = null;
                let isSpecial = false;

                if (number === 20) {
                    numberColor = '#ffd700';
                    glowColor = '#ffaa00';
                    isSpecial = true;
                } else if (number === 1) {
                    numberColor = '#ff4444';
                    glowColor = '#ff0000';
                    isSpecial = true;
                }

                const fontSize = number >= 10 ? 170 : 200;
                ctx.font = `bold ${fontSize}px "Cinzel", Georgia, serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Number indent shadow (carved look)
                ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
                ctx.shadowBlur = 12;
                ctx.shadowOffsetX = 4;
                ctx.shadowOffsetY = 5;

                // Dark outline
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.95)';
                ctx.lineWidth = 10;
                ctx.strokeText(number.toString(), size / 2, size / 2 + 8);

                // Inner shadow for depth
                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                ctx.shadowBlur = 3;
                ctx.shadowOffsetX = -1;
                ctx.shadowOffsetY = -1;
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.lineWidth = 4;
                ctx.strokeText(number.toString(), size / 2, size / 2 + 8);

                // Main number with glow
                ctx.shadowColor = glowColor || 'rgba(255, 255, 255, 0.4)';
                ctx.shadowBlur = isSpecial ? 30 : 10;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
                ctx.fillStyle = numberColor;
                ctx.fillText(number.toString(), size / 2, size / 2 + 8);

                // Highlight pass for 20
                if (number === 20) {
                    ctx.shadowBlur = 50;
                    ctx.shadowColor = '#ffd700';
                    ctx.fillText(number.toString(), size / 2, size / 2 + 8);

                    // Extra glow layer
                    ctx.shadowBlur = 80;
                    ctx.globalAlpha = 0.5;
                    ctx.fillText(number.toString(), size / 2, size / 2 + 8);
                    ctx.globalAlpha = 1;
                }

                // Subtle top highlight on number
                const highlightGrad = ctx.createLinearGradient(size / 2, size / 2 - 60, size / 2, size / 2 + 60);
                highlightGrad.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
                highlightGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0)');
                highlightGrad.addColorStop(1, 'rgba(0, 0, 0, 0.1)');
                ctx.globalCompositeOperation = 'overlay';
                ctx.fillStyle = highlightGrad;
                ctx.fillRect(size / 4, size / 4, size / 2, size / 2);
                ctx.globalCompositeOperation = 'source-over';

                const texture = new THREE.CanvasTexture(canvas);
                texture.minFilter = THREE.LinearMipmapLinearFilter;
                texture.magFilter = THREE.LinearFilter;
                texture.anisotropy = 16;
                texture.colorSpace = THREE.SRGBColorSpace;

                const material = new THREE.MeshPhysicalMaterial({
                    map: texture,
                    normalMap: D20Builder.normalMap,
                    normalScale: new THREE.Vector2(0.15, 0.15),
                    roughnessMap: roughnessMap,
                    aoMap: D20Builder.aoMap,
                    aoMapIntensity: 0.4,
                    metalness: theme.metalness,
                    roughness: theme.roughness,
                    clearcoat: theme.clearcoat,
                    clearcoatRoughness: theme.clearcoatRoughness,
                    clearcoatNormalMap: D20Builder.normalMap,
                    clearcoatNormalScale: new THREE.Vector2(0.05, 0.05),
                    emissive: theme.emissive,
                    emissiveIntensity: theme.emissiveIntensity,
                    envMap: envMap,
                    envMapIntensity: theme.isMetallic ? 1.2 : 0.8,
                    ior: theme.ior || 1.5,
                    thickness: theme.thickness || 0,
                    transmission: theme.transmission || 0,
                    iridescence: theme.iridescence || 0,
                    iridescenceIOR: 1.3,
                    iridescenceThicknessRange: [100, 400],
                    sheen: theme.isMetallic ? 0 : 0.3,
                    sheenRoughness: 0.3,
                    sheenColor: new THREE.Color(theme.accentColor),
                    side: THREE.FrontSide
                });

                return { material, texture };
            }

            blendColors(color1, color2, ratio) {
                const r1 = parseInt(color1.slice(1, 3), 16);
                const g1 = parseInt(color1.slice(3, 5), 16);
                const b1 = parseInt(color1.slice(5, 7), 16);
                const r2 = parseInt(color2.slice(1, 3), 16);
                const g2 = parseInt(color2.slice(3, 5), 16);
                const b2 = parseInt(color2.slice(5, 7), 16);
                const r = Math.round(r1 + (r2 - r1) * ratio);
                const g = Math.round(g1 + (g2 - g1) * ratio);
                const b = Math.round(b1 + (b2 - b1) * ratio);
                return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
            }

            darkenColor(color, amount) {
                const r = Math.max(0, Math.round(parseInt(color.slice(1, 3), 16) * (1 - amount)));
                const g = Math.max(0, Math.round(parseInt(color.slice(3, 5), 16) * (1 - amount)));
                const b = Math.max(0, Math.round(parseInt(color.slice(5, 7), 16) * (1 - amount)));
                return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
            }

            updateTheme(themeName, envMap = null) {
                this.setTheme(themeName);
                const newMaterials = this.getOrCreateThemeMaterials(envMap);
                if (this.dieMesh) {
                    this.dieMesh.material = newMaterials;
                    this.materials = newMaterials;
                }
            }

            getFaceData() { return this.faceData; }
        }

        class D20Simulator {
            constructor() {
                this.container = document.getElementById('canvas-container');
                this.resultDisplay = document.getElementById('result');
                this.historyList = document.getElementById('history');
                this.multiResultsContainer = document.getElementById('multi-results');
                this.rollHistory = [];
                this.rollCount = 0;
                this.isRolling = false;
                this.canRoll = true;
                this.restCheckCounter = 0;
                this.diceCount = 1;
                this.diceMode = 'sum';
                this.dice = [];
                this.currentTheme = 'amethyst';
                this.clock = new THREE.Clock();
                this.dustParticles = null;
                this.init();
            }

            init() {
                this.setupScene();
                this.setupPostProcessing();
                this.setupLights();
                this.setupPhysics();
                this.setupTable();
                this.setupDustParticles();
                this.setupDice();
                this.setupEvents();
                this.setupDiceSelector();
                this.setupPositionalAudio();
                this.animate();
            }

            setupScene() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0a0604);

                // Add subtle fog for atmosphere
                this.scene.fog = new THREE.FogExp2(0x0a0604, 0.04);

                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
                this.camera.position.set(0, 7, 7);
                this.camera.lookAt(0, 0, 0);

                this.renderer = new THREE.WebGLRenderer({
                    antialias: true,
                    powerPreference: 'high-performance',
                    stencil: false
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.2;
                this.renderer.outputColorSpace = THREE.SRGBColorSpace;
                this.renderer.physicallyCorrectLights = true;
                this.container.insertBefore(this.renderer.domElement, this.container.firstChild);

                // Rich HDRI environment
                this.envMap = generateHDRIEnvironment(this.renderer);
                this.scene.environment = this.envMap;

                window.addEventListener('resize', () => this.onResize());
            }

            setupPostProcessing() {
                this.composer = new EffectComposer(this.renderer);

                const renderPass = new RenderPass(this.scene, this.camera);
                this.composer.addPass(renderPass);

                // Bloom for emissive materials and specular highlights
                this.bloomPass = new UnrealBloomPass(
                    new THREE.Vector2(window.innerWidth, window.innerHeight),
                    0.4,  // strength
                    0.6,  // radius
                    0.7   // threshold
                );
                this.composer.addPass(this.bloomPass);

                // Custom vignette + film grain shader
                const vignetteShader = {
                    uniforms: {
                        tDiffuse: { value: null },
                        time: { value: 0 },
                        vignetteIntensity: { value: 0.4 },
                        grainIntensity: { value: 0.025 }
                    },
                    vertexShader: `
                        varying vec2 vUv;
                        void main() {
                            vUv = uv;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform sampler2D tDiffuse;
                        uniform float time;
                        uniform float vignetteIntensity;
                        uniform float grainIntensity;
                        varying vec2 vUv;
                        
                        float random(vec2 co) {
                            return fract(sin(dot(co.xy, vec2(12.9898, 78.233))) * 43758.5453);
                        }
                        
                        void main() {
                            vec4 color = texture2D(tDiffuse, vUv);
                            
                            // Vignette
                            vec2 center = vUv - 0.5;
                            float dist = length(center);
                            float vignette = 1.0 - smoothstep(0.4, 0.9, dist) * vignetteIntensity;
                            color.rgb *= vignette;
                            
                            // Film grain
                            float grain = random(vUv + time) * grainIntensity;
                            color.rgb += grain - grainIntensity * 0.5;
                            
                            // Subtle warm color grading
                            color.r *= 1.02;
                            color.b *= 0.97;
                            
                            gl_FragColor = color;
                        }
                    `
                };

                this.vignettePass = new ShaderPass(vignetteShader);
                this.composer.addPass(this.vignettePass);

                // FXAA anti-aliasing
                const fxaaPass = new ShaderPass(FXAAShader);
                fxaaPass.uniforms['resolution'].value.set(1 / window.innerWidth, 1 / window.innerHeight);
                this.composer.addPass(fxaaPass);
                this.fxaaPass = fxaaPass;

                // Output pass for correct color space
                const outputPass = new OutputPass();
                this.composer.addPass(outputPass);
            }

            setupLights() {
                // Ambient fill - very subtle
                const ambient = new THREE.AmbientLight(0x1a0f08, 0.3);
                this.scene.add(ambient);

                // Key light - warm directional (simulating window/fire)
                const keyLight = new THREE.DirectionalLight(0xffeedd, 1.8);
                keyLight.position.set(4, 12, 4);
                keyLight.castShadow = true;
                keyLight.shadow.mapSize.width = 2048;
                keyLight.shadow.mapSize.height = 2048;
                keyLight.shadow.camera.near = 1;
                keyLight.shadow.camera.far = 30;
                keyLight.shadow.camera.left = -8;
                keyLight.shadow.camera.right = 8;
                keyLight.shadow.camera.top = 8;
                keyLight.shadow.camera.bottom = -8;
                keyLight.shadow.radius = 3;
                keyLight.shadow.bias = -0.0005;
                this.scene.add(keyLight);

                // Rim light - cool backlight
                const rimLight = new THREE.DirectionalLight(0x6688aa, 0.4);
                rimLight.position.set(-3, 8, -6);
                this.scene.add(rimLight);

                // Candle lights with realistic falloff
                this.candleLight1 = new THREE.PointLight(0xff7733, 3, 15, 2);
                this.candleLight1.position.set(4.5, 2.5, 4);
                this.candleLight1.castShadow = true;
                this.candleLight1.shadow.mapSize.width = 512;
                this.candleLight1.shadow.mapSize.height = 512;
                this.scene.add(this.candleLight1);

                this.candleLight2 = new THREE.PointLight(0xff8844, 2.5, 12, 2);
                this.candleLight2.position.set(-4, 2.5, -3);
                this.candleLight2.castShadow = true;
                this.scene.add(this.candleLight2);

                // Secondary fill candles
                this.candleLight3 = new THREE.PointLight(0xff6622, 1.5, 10, 2);
                this.candleLight3.position.set(3, 3, -4);
                this.scene.add(this.candleLight3);

                // Ground bounce light
                const bounceLight = new THREE.HemisphereLight(0x1a0f08, 0x0a0604, 0.2);
                this.scene.add(bounceLight);
            }

            setupDustParticles() {
                const particleCount = 150;
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);
                const velocities = new Float32Array(particleCount * 3);
                const sizes = new Float32Array(particleCount);

                for (let i = 0; i < particleCount; i++) {
                    positions[i * 3] = (Math.random() - 0.5) * 12;
                    positions[i * 3 + 1] = Math.random() * 6;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 12;

                    velocities[i * 3] = (Math.random() - 0.5) * 0.01;
                    velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.005;
                    velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.01;

                    sizes[i] = Math.random() * 0.03 + 0.01;
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));
                geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

                const material = new THREE.PointsMaterial({
                    color: 0xffddaa,
                    size: 0.02,
                    transparent: true,
                    opacity: 0.3,
                    sizeAttenuation: true,
                    blending: THREE.AdditiveBlending
                });

                this.dustParticles = new THREE.Points(geometry, material);
                this.dustParticles.velocities = velocities;
                this.scene.add(this.dustParticles);
            }

            updateDustParticles(time) {
                if (!this.dustParticles) return;

                const positions = this.dustParticles.geometry.attributes.position.array;
                const velocities = this.dustParticles.velocities;

                for (let i = 0; i < positions.length / 3; i++) {
                    // Brownian motion
                    positions[i * 3] += velocities[i * 3] + Math.sin(time * 0.5 + i) * 0.002;
                    positions[i * 3 + 1] += velocities[i * 3 + 1] + Math.cos(time * 0.3 + i * 0.5) * 0.001;
                    positions[i * 3 + 2] += velocities[i * 3 + 2] + Math.sin(time * 0.4 + i * 0.7) * 0.002;

                    // Wrap around
                    if (Math.abs(positions[i * 3]) > 6) positions[i * 3] *= -0.9;
                    if (positions[i * 3 + 1] > 6 || positions[i * 3 + 1] < 0) velocities[i * 3 + 1] *= -1;
                    if (Math.abs(positions[i * 3 + 2]) > 6) positions[i * 3 + 2] *= -0.9;
                }

                this.dustParticles.geometry.attributes.position.needsUpdate = true;
            }

            setupPhysics() {
                this.world = new CANNON.World();
                this.world.gravity.set(0, -35, 0);
                this.world.broadphase = new CANNON.SAPBroadphase(this.world);
                this.world.solver.iterations = 15;
                this.world.allowSleep = true;

                const dieMaterial = new CANNON.Material('die');
                const tableMaterial = new CANNON.Material('table');
                const wallMaterial = new CANNON.Material('wall');

                this.world.addContactMaterial(new CANNON.ContactMaterial(dieMaterial, tableMaterial, {
                    friction: 0.6,
                    restitution: 0.3
                }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(dieMaterial, wallMaterial, {
                    friction: 0.25,
                    restitution: 0.45
                }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(dieMaterial, dieMaterial, {
                    friction: 0.35,
                    restitution: 0.35
                }));

                this.dieMaterial = dieMaterial;
                this.tableMaterial = tableMaterial;
                this.wallMaterial = wallMaterial;

                const groundBody = new CANNON.Body({ mass: 0, material: tableMaterial });
                groundBody.addShape(new CANNON.Plane());
                groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
                this.world.addBody(groundBody);

                this.createWalls();
            }

            createIcosahedronShape(radius) {
                const t = (1 + Math.sqrt(5)) / 2;
                const s = radius / Math.sqrt(1 + t * t);
                const vertices = [
                    new CANNON.Vec3(-s, t * s, 0), new CANNON.Vec3(s, t * s, 0),
                    new CANNON.Vec3(-s, -t * s, 0), new CANNON.Vec3(s, -t * s, 0),
                    new CANNON.Vec3(0, -s, t * s), new CANNON.Vec3(0, s, t * s),
                    new CANNON.Vec3(0, -s, -t * s), new CANNON.Vec3(0, s, -t * s),
                    new CANNON.Vec3(t * s, 0, -s), new CANNON.Vec3(t * s, 0, s),
                    new CANNON.Vec3(-t * s, 0, -s), new CANNON.Vec3(-t * s, 0, s)
                ];
                const faces = [
                    [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
                    [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
                    [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
                    [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]
                ];
                return new CANNON.ConvexPolyhedron({ vertices, faces });
            }

            createWalls() {
                const wallDist = 4.2, wallHeight = 5;
                [[0, wallHeight, wallDist, 0, 0, 0], [0, wallHeight, -wallDist, 0, Math.PI, 0],
                [wallDist, wallHeight, 0, 0, Math.PI / 2, 0], [-wallDist, wallHeight, 0, 0, -Math.PI / 2, 0]].forEach(w => {
                    const wallBody = new CANNON.Body({ mass: 0, material: this.wallMaterial });
                    wallBody.addShape(new CANNON.Box(new CANNON.Vec3(6, wallHeight, 0.3)));
                    wallBody.position.set(w[0], w[1], w[2]);
                    wallBody.quaternion.setFromEuler(w[3], w[4], w[5]);
                    this.world.addBody(wallBody);
                });
                const ceilingBody = new CANNON.Body({ mass: 0, material: this.wallMaterial });
                ceilingBody.addShape(new CANNON.Box(new CANNON.Vec3(6, 0.3, 6)));
                ceilingBody.position.set(0, 8, 0);
                this.world.addBody(ceilingBody);
            }
            setupTable() {
                // Main Wooden Table - Dark Oak finish for Ultra Realistic feel
                const tableGeo = new THREE.BoxGeometry(15, 0.5, 15);
                const woodCanvas = document.createElement('canvas');
                woodCanvas.width = woodCanvas.height = 1024;
                const ctx = woodCanvas.getContext('2d');

                // Deep dark oak finish
                ctx.fillStyle = '#2d1a0a';
                ctx.fillRect(0, 0, 1024, 1024);

                // Fine wood grain fibers
                for (let i = 0; i < 400; i++) {
                    ctx.strokeStyle = `rgba(15, 8, 4, ${0.1 + Math.random() * 0.2})`;
                    ctx.lineWidth = 1 + Math.random() * 3;
                    const y = Math.random() * 1024;
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    for (let x = 0; x < 1024; x += 10) {
                        ctx.lineTo(x, y + Math.sin(x / 50 + i) * 5 + (Math.random() - 0.5) * 2);
                    }
                    ctx.stroke();
                }

                const woodTex = new THREE.CanvasTexture(woodCanvas);
                const tableMat = new THREE.MeshPhysicalMaterial({
                    map: woodTex,
                    roughness: 0.45,
                    metalness: 0.05,
                    clearcoat: 0.2,
                    clearcoatRoughness: 0.3,
                    envMap: this.envMap,
                    envMapIntensity: 0.2
                });

                const table = new THREE.Mesh(tableGeo, tableMat);
                table.position.y = -0.25;
                table.receiveShadow = true;
                this.scene.add(table);

                // Luxury Velvet Inset (Dark Coffee)
                const feltGeo = new THREE.CylinderGeometry(4.2, 4.2, 0.05, 64);
                const feltCanvas = document.createElement('canvas');
                feltCanvas.width = feltCanvas.height = 512;
                const fctx = feltCanvas.getContext('2d');
                fctx.fillStyle = '#1a0d06';
                fctx.fillRect(0, 0, 512, 512);
                for (let i = 0; i < 10000; i++) {
                    const x = Math.random() * 512, y = Math.random() * 512;
                    fctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.02})`;
                    fctx.fillRect(x, y, 1, 1);
                }

                const feltTex = new THREE.CanvasTexture(feltCanvas);
                const feltMat = new THREE.MeshStandardMaterial({
                    map: feltTex,
                    color: 0x3d2a20,
                    roughness: 0.9,
                    metalness: 0
                });
                const felt = new THREE.Mesh(feltGeo, feltMat);
                felt.position.y = 0.02;
                felt.receiveShadow = true;
                this.scene.add(felt);

                // Ornamental Gold Rim
                const torusGeo = new THREE.TorusGeometry(4.25, 0.08, 16, 128);
                const torusMat = new THREE.MeshPhysicalMaterial({
                    color: 0xd4af37,
                    metalness: 1.0,
                    roughness: 0.1,
                    clearcoat: 1.0,
                    envMap: this.envMap,
                    envMapIntensity: 1.5
                });
                const rim = new THREE.Mesh(torusGeo, torusMat);
                rim.rotation.x = Math.PI / 2;
                rim.position.y = 0.05;
                rim.castShadow = true;
                this.scene.add(rim);
            }

            setupDice() {
                this.dice.forEach(d => {
                    this.scene.remove(d.mesh);
                    this.world.removeBody(d.body);
                });
                this.dice = [];
                this.stats = this.stats || { total: 0, sum: 0, crits: 0, fumbles: 0 };

                const positions = [
                    new THREE.Vector3(0, 0.7, 0),
                    new THREE.Vector3(-1.1, 0.7, 0.6),
                    new THREE.Vector3(1.1, 0.7, 0.6),
                    new THREE.Vector3(0, 0.7, -1.2)
                ];

                for (let i = 0; i < this.diceCount; i++) {
                    this.dice.push(this.createSingleDie(i, positions[i]));
                }

                this.cameraTarget = new THREE.Vector3(0, 0, 0);
                this.cameraAnimating = false;
                this.defaultCameraPos = new THREE.Vector3(0, 7, 7);
                this.defaultCameraTarget = new THREE.Vector3(0, 0, 0);
            }

            createSingleDie(index, pos) {
                const builder = new D20Builder(this.currentTheme);
                const mesh = builder.createD20Mesh(this.envMap);
                mesh.castShadow = true;
                mesh.position.copy(pos);
                this.scene.add(mesh);

                const body = new CANNON.Body({
                    mass: 1.2,
                    material: this.dieMaterial,
                    linearDamping: 0.12,
                    angularDamping: 0.15,
                    allowSleep: true,
                    sleepSpeedLimit: 0.08,
                    sleepTimeLimit: 0.4
                });
                body.addShape(this.createIcosahedronShape(0.65));
                body.position.set(pos.x, pos.y, pos.z);
                this.world.addBody(body);

                body.addEventListener('collide', (e) => {
                    const vel = e.contact.getImpactVelocityAlongNormal();
                    if (vel > 1.2) {
                        const volume = Math.min(vel / 25, 0.5);
                        if (this.audioCtx) {
                            const now = this.audioCtx.currentTime;
                            const osc = this.audioCtx.createOscillator();
                            const gain = this.audioCtx.createGain();
                            osc.type = 'triangle';
                            osc.frequency.setValueAtTime(100 + Math.random() * 150, now);
                            osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
                            gain.gain.setValueAtTime(volume * 0.2, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                            osc.connect(gain);
                            gain.connect(this.audioCtx.destination);
                            osc.start(now);
                            osc.stop(now + 0.1);
                        }
                    }
                });

                return { mesh, body, builder, result: null };
            }

            updateDiceCount(count) {
                if (this.isRolling) return;
                this.diceCount = count;
                this.setupDice();
                this.resultDisplay.textContent = '--';
                this.clearMultiResults();
            }

            setupDiceSelector() {
                document.querySelectorAll('.dice-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        if (this.isRolling) return;
                        document.querySelectorAll('.dice-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.updateDiceCount(parseInt(btn.dataset.count));
                    });
                });

                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.diceMode = btn.dataset.mode;
                    });
                });

                document.querySelectorAll('.theme-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.currentTheme = btn.dataset.theme;
                        this.dice.forEach(d => d.builder.updateTheme(this.currentTheme, this.envMap));
                    });
                });
            }

            setupPositionalAudio() {
                this.audioCtx = null;
                const initAudio = () => {
                    if (this.audioCtx) return;
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                };
                document.addEventListener('mousedown', initAudio, { once: true });
                document.addEventListener('touchstart', initAudio, { once: true });
                document.addEventListener('keydown', initAudio, { once: true });
            }

            playThrowSound() {
                if (!this.audioCtx) return;
                const ctx = this.audioCtx, now = ctx.currentTime;
                const noise = ctx.createBufferSource();
                const buffer = ctx.createBuffer(1, ctx.sampleRate * 0.3, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) data[i] = (Math.random() - 0.5) * 2;
                noise.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, now);
                filter.frequency.exponentialRampToValueAtTime(300, now + 0.2);
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                noise.start(now);
            }

            playCriticalSound() {
                if (!this.audioCtx) return;
                const ctx = this.audioCtx, now = ctx.currentTime;

                // Triumphant Fanfare
                [now, now + 0.1, now + 0.2].forEach((st, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    const freq = [523.25, 659.25, 783.99][i]; // C5, E5, G5
                    osc.frequency.setValueAtTime(freq, st);
                    osc.frequency.exponentialRampToValueAtTime(freq * 2, st + 0.5);
                    gain.gain.setValueAtTime(0.1, st);
                    gain.gain.exponentialRampToValueAtTime(0.001, st + 0.5);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(st);
                    osc.stop(st + 0.6);
                });

                // Shimmer effect
                const shimmer = ctx.createOscillator();
                const shimmerGain = ctx.createGain();
                shimmer.type = 'sine';
                shimmer.frequency.setValueAtTime(2000, now + 0.3);
                shimmer.frequency.exponentialRampToValueAtTime(4000, now + 0.8);
                shimmerGain.gain.setValueAtTime(0, now + 0.3);
                shimmerGain.gain.linearRampToValueAtTime(0.05, now + 0.4);
                shimmerGain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
                shimmer.connect(shimmerGain);
                shimmerGain.connect(ctx.destination);
                shimmer.start(now + 0.3);
                shimmer.stop(now + 1);
            }

            playFumbleSound() {
                if (!this.audioCtx) return;
                const ctx = this.audioCtx, now = ctx.currentTime;

                // Descending doom
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.6);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.7);

                // Low rumble
                const rumble = ctx.createOscillator();
                const rumbleGain = ctx.createGain();
                rumble.type = 'sine';
                rumble.frequency.value = 50;
                rumbleGain.gain.setValueAtTime(0.1, now);
                rumbleGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                rumble.connect(rumbleGain);
                rumbleGain.connect(ctx.destination);
                rumble.start(now);
                rumble.stop(now + 0.5);
            }

            setupEvents() {
                const canvas = this.renderer.domElement;
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
                this.isDragging = false;
                this.dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
                this.dragOffset = new THREE.Vector3();
                this.lastDragPos = new THREE.Vector3();
                this.velocityHistory = [];
                this.isHoveringDie = false;

                canvas.addEventListener('mousedown', (e) => this.onMouseDown(e));
                canvas.addEventListener('mousemove', (e) => this.onMouseMove(e));
                canvas.addEventListener('mouseup', (e) => this.onMouseUp(e));
                canvas.addEventListener('mouseleave', (e) => this.onMouseUp(e));
                canvas.addEventListener('touchstart', (e) => { e.preventDefault(); this.onMouseDown(e.touches[0]); }, { passive: false });
                canvas.addEventListener('touchmove', (e) => { e.preventDefault(); this.onMouseMove(e.touches[0]); }, { passive: false });
                canvas.addEventListener('touchend', (e) => { e.preventDefault(); this.onMouseUp(e.changedTouches[0]); }, { passive: false });
                window.addEventListener('keydown', (e) => {
                    if (e.code === 'Space' && this.canRoll && !this.cameraAnimating) { e.preventDefault(); this.quickThrow(); }
                });
                this.setupShakeDetection();
            }

            setupShakeDetection() {
                let lastX = 0, lastY = 0, lastZ = 0, lastShake = 0;
                window.addEventListener('devicemotion', (e) => {
                    const acc = e.accelerationIncludingGravity;
                    if (!acc) return;
                    const shakeMagnitude = Math.abs(acc.x - lastX) + Math.abs(acc.y - lastY) + Math.abs(acc.z - lastZ);
                    if (shakeMagnitude > 25 && Date.now() - lastShake > 1000 && this.canRoll && !this.cameraAnimating) {
                        lastShake = Date.now();
                        this.quickThrow();
                    }
                    lastX = acc.x; lastY = acc.y; lastZ = acc.z;
                });
            }

            updateMousePosition(e) {
                const rect = this.renderer.domElement.getBoundingClientRect();
                this.mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                this.mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            }

            updateCursor() {
                this.renderer.domElement.style.cursor = this.isDragging ? 'grabbing' : (this.isHoveringDie ? 'grab' : 'default');
            }

            checkDieHover() {
                if (this.isDragging) return;
                this.raycaster.setFromCamera(this.mouse, this.camera);
                this.isHoveringDie = this.dice.some(die => this.raycaster.intersectObject(die.mesh, true).length > 0);
                this.updateCursor();
            }

            onMouseDown(e) {
                if (!this.canRoll || this.cameraAnimating) return;
                this.updateMousePosition(e);
                this.raycaster.setFromCamera(this.mouse, this.camera);
                let hitDie = null;
                for (const die of this.dice) {
                    if (this.raycaster.intersectObject(die.mesh, true).length > 0) { hitDie = die; break; }
                }
                if (hitDie) {
                    this.isDragging = true;
                    this.draggedDie = hitDie;
                    this.isRolling = false;
                    this.updateCursor();
                    this.resultDisplay.classList.remove('critical', 'fumble');
                    this.resultDisplay.textContent = '--';
                    this.clearMultiResults();
                    this.dragPlane.set(new THREE.Vector3(0, 1, 0), -hitDie.mesh.position.y);
                    const planeIntersect = new THREE.Vector3();
                    this.raycaster.ray.intersectPlane(this.dragPlane, planeIntersect);
                    this.dragOffset.copy(hitDie.mesh.position).sub(planeIntersect);
                    this.lastDragPos.copy(planeIntersect);
                    this.velocityHistory = [];
                    this.dice.forEach(d => {
                        d.body.wakeUp();
                        d.body.velocity.set(0, 0, 0);
                        d.body.angularVelocity.set(0, 0, 0);
                        d.body.type = CANNON.Body.KINEMATIC;
                        d.mesh.scale.set(1.08, 1.08, 1.08);
                    });
                }
            }

            onMouseMove(e) {
                this.updateMousePosition(e);
                if (!this.isDragging) { this.checkDieHover(); return; }
                if (!this.draggedDie) return;
                this.raycaster.setFromCamera(this.mouse, this.camera);
                const planeIntersect = new THREE.Vector3();
                this.raycaster.ray.intersectPlane(this.dragPlane, planeIntersect);
                if (planeIntersect) {
                    const newPos = planeIntersect.clone().add(this.dragOffset);
                    newPos.x = Math.max(-3.5, Math.min(3.5, newPos.x));
                    newPos.z = Math.max(-3.5, Math.min(3.5, newPos.z));
                    newPos.y = Math.max(0.8, newPos.y + 0.3);
                    const velocity = newPos.clone().sub(this.draggedDie.mesh.position);
                    this.velocityHistory.push({ vel: velocity.clone(), time: performance.now() });
                    if (this.velocityHistory.length > 5) this.velocityHistory.shift();
                    this.dice.forEach((die, i) => {
                        const offset = this.getDiceFormationOffset(i);
                        const targetPos = newPos.clone().add(offset);
                        die.mesh.position.copy(targetPos);
                        die.body.position.copy(targetPos);
                        die.mesh.rotation.x += velocity.z * 0.5;
                        die.mesh.rotation.z -= velocity.x * 0.5;
                        die.body.quaternion.copy(die.mesh.quaternion);
                    });
                    this.lastDragPos.copy(planeIntersect);
                }
            }

            onMouseUp(e) {
                if (!this.isDragging) return;
                this.isDragging = false;
                this.updateCursor();
                this.dice.forEach(d => { d.mesh.scale.set(1, 1, 1); d.body.type = CANNON.Body.DYNAMIC; d.body.wakeUp(); });
                let throwSpeed = 0, avgVel = new THREE.Vector3();
                if (this.velocityHistory.length >= 2) {
                    this.velocityHistory.slice(-4).forEach(v => avgVel.add(v.vel));
                    avgVel.divideScalar(Math.min(4, this.velocityHistory.length));
                    throwSpeed = avgVel.length();
                }
                if (throwSpeed < 0.08) { this.forceProperThrow(); this.velocityHistory = []; this.draggedDie = null; return; }
                const normalizedSpeed = Math.min(throwSpeed, 0.5) / 0.5;
                const throwMult = 20 + normalizedSpeed * 20;
                const direction = avgVel.clone().normalize();
                const finalVelocity = direction.multiplyScalar(Math.min(throwMult * normalizedSpeed, 35));
                this.placeDiceNonOverlapping(this.draggedDie.body.position.clone());
                this.dice.forEach((die, i) => {
                    const variation = 0.3 * (i + 1);
                    die.body.velocity.set(
                        finalVelocity.x + (Math.random() - 0.5) * variation * 10,
                        Math.max(3, 2 + normalizedSpeed * 6) + Math.random() * 2,
                        finalVelocity.z + (Math.random() - 0.5) * variation * 10
                    );
                    const spinMult = 8 + normalizedSpeed * 20;
                    die.body.angularVelocity.set(
                        avgVel.z * spinMult * 30 + (Math.random() - 0.5) * 12,
                        (Math.random() - 0.5) * 12,
