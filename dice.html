                        -avgVel.x * spinMult * 30 + (Math.random() - 0.5) * 12
                    );
                    die.body.wakeUp();
                });
                this.isRolling = true;
                this.canRoll = false;
                this.restCheckCounter = 0;
                this.playThrowSound();
                this.velocityHistory = [];
                this.draggedDie = null;
            }

            placeDiceNonOverlapping(center, minDist = 1.1) {
                const placed = [];
                for (let i = 0; i < this.dice.length; i++) {
                    let position, tries = 0;
                    do {
                        position = new CANNON.Vec3(
                            center.x + (Math.random() - 0.5) * 2,
                            center.y + 0.2 + Math.random() * 0.6,
                            center.z + (Math.random() - 0.5) * 2
                        );
                        tries++;
                    } while (tries < 30 && placed.some(q => Math.sqrt((position.x - q.x) ** 2 + (position.y - q.y) ** 2 + (position.z - q.z) ** 2) < minDist));
                    placed.push(position);
                    this.dice[i].body.position.copy(position);
                    this.dice[i].mesh.position.set(position.x, position.y, position.z);
                }
            }

            getDiceFormationOffset(index) {
                const offsets = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(-0.7, 0.1, 0.4), new THREE.Vector3(0.7, 0.15, 0.4), new THREE.Vector3(0, 0.2, -0.6)];
                return offsets[index] || new THREE.Vector3();
            }

            forceProperThrow() {
                this.playThrowSound();
                this.placeDiceNonOverlapping(new CANNON.Vec3(0, 3.5, -2), 1.2);
                this.dice.forEach(die => {
                    const angle = Math.random() * Math.PI * 2, force = 10 + Math.random() * 8;
                    die.body.velocity.set(Math.cos(angle) * force * 0.5 + (Math.random() - 0.5) * 3, 4 + Math.random() * 3, Math.sin(angle) * force * 0.3 + 6);
                    const spin = 15 + Math.random() * 10;
                    die.body.angularVelocity.set((Math.random() - 0.5) * spin, (Math.random() - 0.5) * spin, (Math.random() - 0.5) * spin);
                    die.body.quaternion.setFromEuler(Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2);
                    die.body.wakeUp();
                });
                this.isRolling = true;
                this.canRoll = false;
                this.restCheckCounter = 0;
            }

            quickThrow() {
                this.isRolling = true;
                this.canRoll = false;
                this.restCheckCounter = 0;
                this.resultDisplay.classList.remove('critical', 'fumble');
                this.resultDisplay.textContent = '--';
                this.clearMultiResults();
                this.placeDiceNonOverlapping(new CANNON.Vec3(0, 3.5, -3), 1.2);
                this.dice.forEach(die => {
                    const startX = die.body.position.x;
                    die.body.velocity.set(-startX * 0.3 + (Math.random() - 0.5) * 4, 4 + Math.random() * 2, 7 + Math.random() * 4);
                    die.body.angularVelocity.set((Math.random() - 0.5) * 18, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 18);
                    die.body.quaternion.setFromEuler(Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2);
                    die.body.wakeUp();
                });
                this.playThrowSound();
            }

            getTopFace(die) {
                const faceData = die.builder.getFaceData();
                const up = new THREE.Vector3(0, 1, 0);
                const q = die.body.quaternion;
                const quat = new THREE.Quaternion(q.x, q.y, q.z, q.w);
                let maxDot = -Infinity, result = 1;
                for (const face of faceData) {
                    const dot = face.normal.clone().applyQuaternion(quat).dot(up);
                    if (dot > maxDot) { maxDot = dot; result = face.value; }
                }
                return result;
            }

            getAllResults() { return this.dice.map(die => this.getTopFace(die)); }
            clearMultiResults() { this.multiResultsContainer.innerHTML = ''; }

            showResult() {
                this.rollCount++;
                const results = this.getAllResults();
                this.dice.forEach((die, i) => die.result = results[i]);
                let finalValue, best = Math.max(...results), worst = Math.min(...results);
                switch (this.diceMode) {
                    case 'advantage': finalValue = best; break;
                    case 'disadvantage': finalValue = worst; break;
                    default: finalValue = results.reduce((a, b) => a + b, 0);
                }
                let chosenResult = this.diceMode === 'advantage' ? best : (this.diceMode === 'disadvantage' ? worst : null);
                const isCrit = chosenResult !== null ? chosenResult === 20 : results.includes(20);
                const isFumble = chosenResult !== null ? chosenResult === 1 : results.includes(1);
                this.stats.total++;
                this.stats.sum += finalValue;
                if (isCrit) this.stats.crits++;
                if (isFumble) this.stats.fumbles++;
                this.updateStatsDisplay();
                this.animateCameraToResult();
                setTimeout(() => {
                    if (this.diceCount > 1) this.showMultiResults(results, best, worst, chosenResult);
                    this.resultDisplay.textContent = finalValue;
                    this.resultDisplay.classList.remove('critical', 'fumble');
                    if (isCrit) {
                        this.resultDisplay.classList.add('critical');
                        this.createParticles(true);
                        this.playCriticalSound();
                        // Boost bloom temporarily for crit
                        if (this.bloomPass) {
                            const origStrength = this.bloomPass.strength;
                            this.bloomPass.strength = 1.2;
                            setTimeout(() => { this.bloomPass.strength = origStrength; }, 1000);
                        }
                    }
                    else if (isFumble) {
                        this.resultDisplay.classList.add('fumble');
                        this.createParticles(false);
                        this.playFumbleSound();
                    }
                    this.addToHistory(finalValue, results);
                }, 300);
                setTimeout(() => { this.animateCameraToDefault(); this.canRoll = true; }, 2500);
            }

            showMultiResults(results, best, worst, chosenResult) {
                this.multiResultsContainer.innerHTML = '';
                results.forEach((value, i) => {
                    const div = document.createElement('div');
                    div.className = 'die-result';
                    if (value === 20) div.classList.add('critical');
                    else if (value === 1) div.classList.add('fumble');
                    if (this.diceMode === 'advantage') {
                        if (value === best && value === chosenResult) div.classList.add('best');
                        else div.classList.add('ignored');
                    } else if (this.diceMode === 'disadvantage') {
                        if (value === worst && value === chosenResult) div.classList.add('worst');
                        else div.classList.add('ignored');
                    }
                    div.innerHTML = '<div class="die-label">D' + (i + 1) + '</div><div class="die-value">' + value + '</div>';
                    this.multiResultsContainer.appendChild(div);
                    setTimeout(() => div.classList.add('show'), i * 100);
                });
            }

            updateStatsDisplay() {
                const avg = this.stats.total > 0 ? (this.stats.sum / this.stats.total).toFixed(1) : '--';
                document.getElementById('stat-avg').textContent = avg;
                document.getElementById('stat-crits').textContent = this.stats.crits;
                document.getElementById('stat-fumbles').textContent = this.stats.fumbles;
            }

            animateCameraToResult() {
                this.cameraAnimating = true;
                const center = new THREE.Vector3();
                this.dice.forEach(d => center.add(d.mesh.position));
                center.divideScalar(this.dice.length);
                const distanceMult = 1 + (this.diceCount - 1) * 0.3;
                const targetCamPos = new THREE.Vector3(center.x + distanceMult, center.y + 3 * distanceMult, center.z + 2 * distanceMult);
                const startPos = this.camera.position.clone();
                const startTarget = this.cameraTarget.clone();
                const endTarget = center.clone();
                endTarget.y += 0.2;
                const startTime = performance.now();
                const animate = () => {
                    const progress = Math.min((performance.now() - startTime) / 600, 1);
                    const ease = 1 - Math.pow(1 - progress, 4);
                    this.camera.position.lerpVectors(startPos, targetCamPos, ease);
                    this.cameraTarget.lerpVectors(startTarget, endTarget, ease);
                    this.camera.lookAt(this.cameraTarget);
                    if (progress < 1) requestAnimationFrame(animate);
                };
                requestAnimationFrame(animate);
            }

            animateCameraToDefault() {
                const startPos = this.camera.position.clone();
                const startTarget = this.cameraTarget.clone();
                const startTime = performance.now();
                const animate = () => {
                    const progress = Math.min((performance.now() - startTime) / 800, 1);
                    const ease = 1 - Math.pow(1 - progress, 3);
                    this.camera.position.lerpVectors(startPos, this.defaultCameraPos, ease);
                    this.cameraTarget.lerpVectors(startTarget, this.defaultCameraTarget, ease);
                    this.camera.lookAt(this.cameraTarget);
                    if (progress < 1) requestAnimationFrame(animate);
                    else this.cameraAnimating = false;
                };
                requestAnimationFrame(animate);
            }

            addToHistory(value, results = null) {
                this.rollHistory.unshift({ num: this.rollCount, value, results, mode: this.diceMode });
                if (this.rollHistory.length > 15) this.rollHistory.pop();
                this.historyList.innerHTML = this.rollHistory.map(r => {
                    let cls = '';
                    if (r.results) {
                        const best = Math.max(...r.results), worst = Math.min(...r.results);
                        if (r.mode === 'advantage') cls = best === 20 ? 'crit' : (best === 1 ? 'fail' : '');
                        else if (r.mode === 'disadvantage') cls = worst === 20 ? 'crit' : (worst === 1 ? 'fail' : '');
                        else cls = r.results.includes(20) ? 'crit' : (r.results.includes(1) ? 'fail' : '');
                    } else cls = r.value === 20 ? 'crit' : (r.value === 1 ? 'fail' : '');
                    return '<li class="history-item"><span class="roll-num">#' + r.num + '</span><span class="roll-value ' + cls + '">' + r.value + '</span></li>';
                }).join('');
            }

            createParticles(isCrit) {
                const container = document.getElementById('particles');
                const colors = isCrit
                    ? ['#ffd700', '#ffec8b', '#ff8c00', '#fff8dc']
                    : ['#ff4444', '#dc143c', '#8b0000', '#ff6b6b'];
                const count = isCrit ? 80 : 40;

                for (let i = 0; i < count; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    p.style.left = '50%';
                    p.style.top = '25%';
                    const size = 4 + Math.random() * 10;
                    p.style.width = p.style.height = size + 'px';
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    p.style.background = color;
                    p.style.boxShadow = '0 0 ' + (10 + Math.random() * 15) + 'px ' + color;
                    container.appendChild(p);

                    const angle = Math.random() * Math.PI * 2;
                    const speed = 200 + Math.random() * 350;
                    const vx = Math.cos(angle) * speed;
                    let vy = Math.sin(angle) * speed - 200;
                    let x = 0, y = 0, opacity = 1, rotation = Math.random() * 360;
                    const rotSpeed = (Math.random() - 0.5) * 20;

                    const animate = () => {
                        x += vx * 0.016;
                        vy += 500 * 0.016;
                        y += vy * 0.016;
                        opacity -= 0.018;
                        rotation += rotSpeed;
                        p.style.transform = 'translate(' + x + 'px, ' + y + 'px) rotate(' + rotation + 'deg)';
                        p.style.opacity = Math.max(0, opacity);
                        if (opacity > 0) requestAnimationFrame(animate);
                        else p.remove();
                    };
                    setTimeout(() => requestAnimationFrame(animate), i * 8);
                }
            }

            isAtRest() {
                return this.dice.every(die => {
                    if (die.body.sleepState === CANNON.Body.SLEEPING) return true;
                    const v = die.body.velocity, av = die.body.angularVelocity;
                    const linSpeed = Math.sqrt(v.x ** 2 + v.y ** 2 + v.z ** 2);
                    const angSpeed = Math.sqrt(av.x ** 2 + av.y ** 2 + av.z ** 2);
                    return linSpeed < 0.05 && angSpeed < 0.1 && die.body.position.y < 1.2;
                });
            }

            checkOOB() {
                this.dice.forEach(die => {
                    const pos = die.body.position;
                    if (Math.abs(pos.x) > 5 || Math.abs(pos.z) > 5 || pos.y < -1 || pos.y > 10) {
                        die.body.position.set((Math.random() - 0.5) * 2, 2, (Math.random() - 0.5) * 2);
                        die.body.velocity.set((Math.random() - 0.5) * 3, 1, (Math.random() - 0.5) * 3);
                        die.body.angularVelocity.set((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
                        die.body.wakeUp();
                    }
                });
            }

            onResize() {
                const w = window.innerWidth, h = window.innerHeight;
                this.camera.aspect = w / h;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(w, h);
                this.composer.setSize(w, h);
                if (this.fxaaPass) {
                    this.fxaaPass.uniforms['resolution'].value.set(1 / w, 1 / h);
                }
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                const time = performance.now() * 0.001;
                const dt = this.clock.getDelta();

                // Physics
                this.world.step(1 / 60, dt, 3);
                if (this.isRolling) this.checkOOB();
                this.dice.forEach(die => {
                    die.mesh.position.copy(die.body.position);
                    die.mesh.quaternion.copy(die.body.quaternion);
                });

                // Rest check
                if (this.isRolling) {
                    if (this.isAtRest()) {
                        this.restCheckCounter++;
                        if (this.restCheckCounter > 35) { this.isRolling = false; this.showResult(); }
                    } else this.restCheckCounter = 0;
                }

                // Animated candle flicker
                const flicker1 = Math.sin(time * 15) * 0.3 + Math.sin(time * 23) * 0.15 + Math.sin(time * 31) * 0.1;
                const flicker2 = Math.sin(time * 13 + 1) * 0.25 + Math.sin(time * 19 + 2) * 0.15;
                const flicker3 = Math.sin(time * 17 + 3) * 0.2 + Math.sin(time * 29) * 0.1;

                this.candleLight1.intensity = 3 + flicker1;
                this.candleLight2.intensity = 2.5 + flicker2;
                this.candleLight3.intensity = 1.5 + flicker3;

                // Subtle candle position wobble
                this.candleLight1.position.x = 4.5 + Math.sin(time * 2) * 0.02;
                this.candleLight2.position.x = -4 + Math.sin(time * 1.7 + 1) * 0.02;

                // Update dust particles
                this.updateDustParticles(time);

                // Update vignette shader time for grain animation
                if (this.vignettePass) {
                    this.vignettePass.uniforms.time.value = time;
                }

                // Render with post-processing
                this.composer.render();
            }
        }

        new D20Simulator();
    </script>
</body>
